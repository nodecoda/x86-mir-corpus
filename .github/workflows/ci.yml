name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: python -m unittest discover -s tests -q
      - run: |
          python -m x86_mir_corpus dsl audit --target x86 \
            --input src/x86_mir_corpus/assets/source-snapshots/fed20e0e-X86LegalizerInfo.cpp --strict
          python -m x86_mir_corpus dsl audit --target aarch64 \
            --input src/x86_mir_corpus/assets/source-snapshots/fed20e0e-AArch64LegalizerInfo.cpp --strict

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build --wheel
      - run: |
          python -m venv smoke
          . smoke/bin/activate
          pip install dist/*.whl
          x86-mir-corpus --help
          x86-mir-corpus parse --help >/dev/null

  sidecar:
    # Self-hosted runner with a pinned LLVM build and cached corpora.
    if: ${{ vars.X86_MIR_LLVM_BUILD != '' }}
    runs-on: [self-hosted, llvm]
    steps:
      - uses: actions/checkout@v4
      - run: pip install .
      - run: |
          x86-mir-corpus llvm build \
            --llvm-src "$X86_MIR_LLVM_SRC" \
            --llvm-build "$X86_MIR_LLVM_BUILD" --out .build
      - run: x86-mir-corpus doctor --json
      - run: python -m unittest discover -s tests -p 'test_sidecar_parity.py' -v
        env:
          X86_MIR_SIDECAR_BUILD: ${{ github.workspace }}/.build
          X86_MIR_PARITY: "1"
      - run: python -m unittest discover -s tests -p 'test_type_contract.py' -v
        env:
          X86_MIR_SIDECAR_BUILD: ${{ github.workspace }}/.build
      - run: |
          x86-mir-corpus mir-run \
            --corpus tests/fixtures/aarch64-smoke.json \
            --driver .build/x86-mir-run \
            --rules production --jobs 2 --shard-size 10 \
            --timeout 30 --max-steps 10000 \
            --out /tmp/aarch64-smoke.report.json || test $? -eq 1
          python - <<'PY'
          import json
          report = json.load(open("/tmp/aarch64-smoke.report.json"))
          assert report["target"] == "aarch64", report
          assert report["corpus"]["target"] == "aarch64", report["corpus"]
          assert sum(report["counts"].values()) == report["atoms"]
          print(report["counts"])
          PY

  aarch64-witness:
    # Optional large job: regenerate and run the AArch64 A2 witness.  Enable by
    # setting the X86_MIR_RUN_AARCH64_WITNESS repository variable.
    if: ${{ vars.X86_MIR_RUN_AARCH64_WITNESS != '' }}
    runs-on: [self-hosted, llvm]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: pip install .
      - run: |
          x86-mir-corpus llvm build \
            --llvm-src "$X86_MIR_LLVM_SRC" \
            --llvm-build "$X86_MIR_LLVM_BUILD" --out .build
      - run: |
          x86-mir-corpus corpus --target aarch64 --config A2 --tier witness \
            --repo "$X86_MIR_LLVM_SRC" --allow-coverage-gaps --oracle=none \
            --out /tmp/a64-witness.json
          x86-mir-corpus mir-run --corpus /tmp/a64-witness.json \
            --driver .build/x86-mir-run --rules production \
            --jobs 8 --shard-size 300 --timeout 30 --max-steps 10000 \
            --out /tmp/a64-witness.report.json
          python - <<'PY'
          import json
          report = json.load(open("/tmp/a64-witness.report.json"))
          counts = report["counts"]
          assert report["a3"]["met"], report["a3"]
          assert sum(counts.values()) == report["atoms"]
          assert not any(counts[k] for k in ("crash", "hang", "budget", "not_run"))
          print(counts)
          PY
