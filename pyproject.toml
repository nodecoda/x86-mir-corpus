[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "x86-mir-corpus"
version = "0.2.0"
description = "X86 legalizer corpus reader and MIR legalization corpus supervisor"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0 WITH LLVM-exception"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "x86-mir-corpus contributors" }]
keywords = ["llvm", "x86", "globalisel", "legalizer", "mir"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: C++",
  "Topic :: Software Development :: Compilers",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8",
  "ruff>=0.5",
]

[project.scripts]
x86-mir-corpus = "x86_mir_corpus.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
x86_mir_corpus = [
  "assets/*.json",
  "assets/source-snapshots/*.cpp",
]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["build", "*.egg-info", "corpora"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "RUF"]
# E501: formatting is handled separately; the codebase predates ruff.
# RUF059: tests unpack tuples for readability and intentionally ignore fields.
ignore = ["E501", "RUF059"]

[tool.ruff.lint.isort]
known-first-party = ["x86_mir_corpus", "testlib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
